<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم — Comprendre le Coran</title>
  <meta name="description" content="Apprendre et comprendre le Coran verset par verset — traduction mot à mot, racines arabes, analyse de profondeur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== VARIABLES ===== */
    :root {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: #2e2e2e;
      --border2: #3a3a3a;
      --text: #e8e8e8;
      --text2: #a0a0a0;
      --text3: #606060;
      --gold: #c9a84c;
      --gold2: #e8c97a;
      --green: #4a9e7a;
      --radius: 10px;
      --radius-sm: 6px;
    }
    [data-theme="light"] {
      --bg: #fafaf8;
      --bg2: #f0ede6;
      --bg3: #e8e4db;
      --border: #d8d4cb;
      --border2: #c8c4bb;
      --text: #1a1a1a;
      --text2: #555550;
      --text3: #999990;
      --gold: #8b6914;
      --gold2: #a07820;
      --green: #2d6b50;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }
    button {
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }
    input, select {
      font-family: 'Inter', sans-serif;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--gold); }
    select option { background: var(--bg2); }

    /* ===== LAYOUT ===== */
    .app { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; }

    /* ===== HEADER ===== */
    .site-header {
      text-align: center;
      padding: 40px 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      position: relative;
    }
    .site-header h1 {
      font-family: 'Amiri', serif;
      font-size: 42px;
      color: var(--gold);
      letter-spacing: 2px;
      line-height: 1.2;
    }
    .site-header .subtitle {
      font-size: 13px;
      color: var(--text2);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    .theme-toggle {
      position: absolute;
      top: 40px;
      right: 0;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text2);
      transition: border-color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--gold); color: var(--gold); }

    /* ===== STATS ===== */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-item {
      flex: 1;
      min-width: 120px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      text-align: center;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 600;
      color: var(--gold);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text3);
      margin-top: 2px;
    }

    /* ===== LISTE SOURATES ===== */
    #list-view {}
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .controls input { flex: 1; min-width: 180px; }
    .controls select { min-width: 140px; }

    .sourate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }
    .s-card-badges { display: flex; align-items: center; gap: 5px; }
    .s-read-check { width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0;
      background: var(--green); color: #fff; font-size: 10px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; }
    .s-card.is-read { border-color: var(--green); }
    .s-card.is-read .s-ar { opacity: .82; }
    #btn-hide-read { background: transparent; border: 1px solid var(--border); color: var(--text2);
      border-radius: 6px; padding: 9px 14px; cursor: pointer; font-size: 13px; font-family: inherit; white-space: nowrap; }
    #btn-hide-read:hover { border-color: var(--gold); color: var(--gold); }
    #btn-hide-read.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.1); }
    .s-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .s-card:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .s-card.has-data { border-left: 3px solid var(--green); }
    .s-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .s-num {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
    }
    .s-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg3);
      color: var(--text3);
    }
    .s-badge.mecquoise { color: var(--gold); background: rgba(201,168,76,0.1); }
    .s-badge.medinoise { color: var(--green); background: rgba(74,158,122,0.1); }
    .s-ar {
      font-family: 'Amiri', serif;
      font-size: 20px;
      color: var(--text);
      direction: rtl;
      text-align: right;
    }
    .s-fr {
      font-size: 12px;
      color: var(--text2);
    }
    .s-versets {
      font-size: 11px;
      color: var(--text3);
    }
    .no-result {
      text-align: center;
      padding: 3rem;
      color: var(--text3);
      font-size: 14px;
      grid-column: 1/-1;
    }

    /* ===== VIEWER ===== */
    #viewer-view { display: none; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 16px;
      padding: 6px 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--gold); }

    .viewer {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .viewer-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }
    .viewer-header-top {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }
    .v-ar-name {
      font-family: 'Amiri', serif;
      font-size: 28px;
      color: var(--gold);
    }
    .v-fr-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
    }
    .v-meta { font-size: 12px; color: var(--text3); }
    .s-rev { font-size: 11px; color: var(--gold); margin-top: 6px; opacity: 0.85; }
    .v-theme {
      font-size: 13px;
      color: var(--text2);
      margin-top: 6px;
      font-style: italic;
    }

    /* Navigation versets */
    .v-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .v-nav-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text2);
      transition: all 0.2s;
    }
    .v-nav-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .v-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .v-counter {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--text2);
    }
    .v-progress {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 24px;
    }
    .v-progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Corps du verset */
    .verset-body { padding: 24px; }
    .arabic-display {
      font-family: 'Amiri', serif;
      font-size: 32px;
      line-height: 2;
      direction: rtl;
      text-align: right;
      color: var(--text);
      margin-bottom: 8px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .translit-line {
      font-size: 14px;
      color: var(--text2);
      font-style: italic;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Traduction */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .traduction-text {
      font-size: 16px;
      color: var(--text);
      line-height: 1.8;
    }
    .traduction-auteur {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
    }

    /* Mot à mot */
    .mots-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      direction: rtl;
    }
    .mot-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.2s;
      text-align: center;
    }
    .mot-card:hover { border-color: var(--gold); }
    .mot-card.active { border-color: var(--gold); background: rgba(201,168,76,0.08); }
    .mot-ar { font-family: 'Amiri', serif; font-size: 22px; color: var(--text); direction: rtl; }
    .mot-translit { font-size: 11px; color: var(--text3); font-style: italic; margin-top: 2px; }
    .mot-fr-label { font-size: 12px; color: var(--gold); margin-top: 4px; font-weight: 500; }

    /* Détail mot */
    .mot-detail {
      margin-top: 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: none;
    }
    .mot-detail.active { display: block; }
    .mot-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .mot-detail-ar {
      font-family: 'Amiri', serif;
      font-size: 30px;
      color: var(--gold);
      direction: rtl;
    }
    .mot-detail-info { flex: 1; }
    .mot-detail-fr { font-size: 15px; font-weight: 500; color: var(--text); }
    .mot-detail-translit { font-size: 13px; color: var(--text2); font-style: italic; }
    .racine-badge {
      background: rgba(201,168,76,0.15);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      direction: rtl;
    }
    .freq-badge {
      background: rgba(74,158,122,0.15);
      color: var(--green);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .famille-list {
      margin: 10px 0;
    }
    .famille-list-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .famille-list ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .famille-list ul li {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 13px;
      color: var(--text2);
    }
    .profondeur-box {
      background: var(--bg2);
      border-left: 3px solid var(--gold);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text2);
      line-height: 1.7;
      margin-top: 10px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* Analyse */
    .analyse-box {
      background: var(--bg3);
      border-left: 3px solid var(--gold);
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text2);
      line-height: 1.75;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .couche-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(201,168,76,0.12);
      color: var(--gold);
    }

    /* Racines */
    .racines-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .racine-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .racine-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .racine-ar {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      direction: rtl;
    }
    .racine-sens { font-size: 13px; color: var(--text2); }

    /* Résumé pédagogique */
    .resume-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .resume-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .resume-card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--text2);
    }
    .tag.gold { color: var(--gold); border-color: rgba(201,168,76,0.3); }
    .declic-box {
      grid-column: 1/-1;
      background: rgba(74,158,122,0.08);
      border: 1px solid rgba(74,158,122,0.3);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 13px;
      color: var(--text2);
      line-height: 1.7;
    }

    /* Sourate sans données */
    .no-data-box {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text3);
    }
    .no-data-box .big { font-size: 40px; margin-bottom: 12px; }
    .no-data-box p { font-size: 14px; line-height: 1.7; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .site-header h1 { font-size: 32px; }
      .arabic-display { font-size: 26px; }
      .stats-bar { gap: 8px; }
      .resume-grid { grid-template-columns: 1fr; }
      .theme-toggle { top: 16px; }
    }
  </style>
  <link rel="stylesheet" href="./data/nav.css">
</head>

// Thème d'une sourate dans la langue courante (repli sur le FR de SOURATES_META[6]).
function themeSens(s, lang) {
  lang = lang || currentLang();
  const fr = (s && s[6]) || "";
  if (lang === "fr") return fr;
  const loc = SOURATES_THEME[lang];
  return (loc && loc[s[0]]) || fr;
}


// Registre des sourates avec données complètes
const SOURATES_DATA = {};

// Chargement dynamique des données
async function loadSourateData(num) {
  if (SOURATES_DATA[num]) return SOURATES_DATA[num];
  try {
    const mod = await import(`./sourates/s${String(num).padStart(3,'0')}.js`);
    SOURATES_DATA[num] = mod.default || Object.values(mod)[0];
    return SOURATES_DATA[num];
  } catch(e) {
    return null;
  }
}

// ----- Langue d'interface -----
function currentLang() { return localStorage.getItem('lang') || 'fr'; }

// Sens du nom d'une sourate dans la langue courante (repli sur le FR).
function nomSens(num, lang) {
  lang = lang || currentLang();
  const meta = SOURATES_META.find(s => s[0] === num);
  const fr = meta ? meta[3] : '';
  if (lang === 'fr') return fr;
  const loc = SOURATES_NOM[num];
  return (loc && loc[lang]) || fr;
}

function updateLangBtns() {
  const l = currentLang();
  ['fr', 'en', 'tr'].forEach(x => {
    const btn = document.getElementById('btn-' + x);
    if (!btn) return;
    btn.style.borderColor = x === l ? 'var(--gold)' : 'var(--border)';
    btn.style.color = x === l ? 'var(--gold)' : 'var(--text2)';
  });
}

window.setLang = function(lang) {
  localStorage.setItem('lang', lang);
  document.documentElement.setAttribute('lang', lang);
  updateLangBtns();
  applyStaticI18n();
  filterSourates();
  const viewerOpen = document.getElementById('viewer-view').style.display === 'block';
  if (viewerOpen && currentS) {
    document.getElementById('v-fr-name').textContent = nomSens(currentS[0]);
    document.getElementById('v-meta').textContent = metaLine(currentS);
    document.getElementById('v-theme').textContent = themeSens(currentS);
    renderVerset();
  }
};

// Stats
function updateStats() {
  const analysees = Object.values(SOURATES_DATA)
    .filter(d => d)
    .reduce((acc, d) => acc + (d.versets ? d.versets.length : 0), 0);
  document.getElementById('stat-analysees').textContent = analysees;
  document.getElementById('stat-pct').textContent = Math.round(analysees / 6236 * 100) + '%';
}

// Rendu grille
function renderGrid(list, sort = 'mushaf') {
  const grid = document.getElementById('sourate-grid');
  if (!list.length) {
    grid.innerHTML = '<div class="no-result">' + T('no_result') + '</div>';
    return;
  }
  grid.innerHTML = list.map(s => {
    const hasData = !!SOURATES_DATA[s[0]];
    const typeClass = s[5] === 'M' ? 'mecquoise' : 'medinoise';
    const typeLabel = s[5] === 'M' ? T('meccan') : T('medinan');
    const rev = REVELATION_ORDER[s[0]];
    const revLine = sort === 'revelation'
      ? `<div class="s-rev">${T('label_revelation')} nº${rev} · ${T('label_mushaf')} nº${s[0]}</div>`
      : '';
    const isRead = ProgressMod && ProgressMod.isSurahRead(s[0]);
    return `<div class="s-card ${hasData ? 'has-data' : ''} ${isRead ? 'is-read' : ''}" onclick="openSourate(${s[0]})">
      <div class="s-card-top">
        <span class="s-num">${s[0]}</span>
        <span class="s-card-badges">
          ${isRead ? '<span class="s-read-check" title="' + T('label_lu') + '">✓</span>' : ''}
          <span class="s-badge ${typeClass}">${typeLabel}</span>
        </span>
      </div>
      <div class="s-ar">${s[2]}</div>
      <div class="s-fr">${nomSens(s[0])}</div>
      <div class="s-versets">${s[4]} ${T('label_versets')}${hasData ? ' · ✓ ' + T('label_analysee') : ''}</div>
      ${revLine}
    </div>`;
  }).join('');
}

let hideRead = localStorage.getItem('cc_hide_read') === '1';

window.toggleHideRead = function() {
  hideRead = !hideRead;
  localStorage.setItem('cc_hide_read', hideRead ? '1' : '0');
  updateHideReadBtn();
  filterSourates();
};

function updateHideReadBtn() {
  const b = document.getElementById('btn-hide-read');
  if (!b) return;
  b.classList.toggle('active', hideRead);
  b.textContent = T(hideRead ? 'show_read' : 'hide_read');
}

function filterSourates() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const type = document.getElementById('type-filter').value;
  const sort = document.getElementById('sort-filter').value;
  const filtered = SOURATES_META.filter(s => {
    const nom = SOURATES_NOM[s[0]] || {};
    const matchQ = !q || s[1].toLowerCase().includes(q) || s[3].toLowerCase().includes(q)
      || (nom.en && nom.en.toLowerCase().includes(q)) || (nom.tr && nom.tr.toLowerCase().includes(q))
      || s[0].toString().includes(q);
    const matchT = !type || s[5] === type;
    const matchR = !hideRead || !(ProgressMod && ProgressMod.isSurahRead(s[0]));
    return matchQ && matchT && matchR;
  });
  if (sort === 'revelation') {
    filtered.sort((a, b) => REVELATION_ORDER[a[0]] - REVELATION_ORDER[b[0]]);
  } else {
    filtered.sort((a, b) => a[0] - b[0]);
  }
  renderGrid(filtered, sort);
}

// Ouvrir sourate
async function openSourate(num) {
  currentS = SOURATES_META.find(s => s[0] === num);
  currentIdx = 0;
  currentTab = 'traduction';
  selectedMot = null;

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('viewer-view').style.display = 'block';
  document.getElementById('stats-bar').style.display = 'none';

  document.getElementById('v-ar-name').textContent = currentS[2];
  document.getElementById('v-fr-name').textContent = nomSens(currentS[0]);
  document.getElementById('v-meta').textContent = metaLine(currentS);
  document.getElementById('v-theme').textContent = themeSens(currentS);
  updateReadBtn();

  document.getElementById('verset-body').innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text3)">' + T('loading') + '</div>';
  currentData = await loadSourateData(num);
  updateStats();
  renderVerset();
}

// Rendu verset
function renderVerset() {
  const total = currentS[4];
  document.getElementById('v-counter').textContent = `Verset ${currentIdx + 1} / ${total}`;
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === total - 1;
  document.getElementById('v-progress-fill').style.width = ((currentIdx + 1) / total * 100) + '%';

  if (!currentData || !currentData.versets || !currentData.versets[currentIdx]) {
    renderNoData();
    return;
  }

  const v = currentData.versets[currentIdx];
  const uiLang = (localStorage.getItem('lang') || 'fr');
  const trFr = v.traductions?.[uiLang] || v.traductions?.fr || { auteur: 'Hamidullah', texte: v.traduction_fr || '' };

  document.getElementById('verset-body').innerHTML = `
    <div class="arabic-display">${v.ar}</div>
    <div class="translit-line">${v.translit}</div>

    <div class="tabs">
      <button class="tab-btn ${currentTab==='traduction'?'active':''}" onclick="setTab('traduction')">${T('tab_traduction')}</button>
      <button class="tab-btn ${currentTab==='mots'?'active':''}" onclick="setTab('mots')">${T('tab_mots')}</button>
      <button class="tab-btn ${currentTab==='analyse'?'active':''}" onclick="setTab('analyse')">${T('tab_analyse')}</button>
      <button class="tab-btn ${currentTab==='resume'?'active':''}" onclick="setTab('resume')">${T('tab_resume')}</button>
    </div>

    <div class="tab-panel ${currentTab==='traduction'?'active':''}" id="panel-traduction">
      <div class="section-label">${T('label_traduction_fr')}</div>
      <div class="traduction-text">${trFr.texte}</div>
      <div class="traduction-auteur">— ${trFr.auteur}</div>
    </div>

    <div class="tab-panel ${currentTab==='mots'?'active':''}" id="panel-mots">
      <div class="section-label">${T('label_click_word')}</div>
      <div class="mots-grid" id="mots-grid">
        ${!(v.mots||[]).length ? `<div style="color:var(--text3);padding:1rem;grid-column:1/-1">${T('wip_mots')}</div>` : ''}
        ${(v.mots||[]).map((m,i) => `
          <div class="mot-card" id="mot-${i}" onclick="selectMot(${i})">
            <div class="mot-ar">${m.ar}</div>
            <div class="mot-translit">${m.translit}</div>
            <div class="mot-fr-label">${m.fr}</div>
          </div>
        `).join('')}
      </div>
      <div class="mot-detail" id="mot-detail"></div>
    </div>

    <div class="tab-panel ${currentTab==='analyse'?'active':''}" id="panel-analyse">
      <div class="section-label">${T('label_analyse_global')}</div>
      <div class="analyse-box">
        ${v.analyse_globale || T('wip_analyse')}
        <div class="couche-badge">${T('label_couche')} ${v.niveau_couche || 1} / 5</div>
      </div>
    </div>

    <div class="tab-panel ${currentTab==='resume'?'active':''}" id="panel-resume">
      ${renderResume()}
    </div>
  `;
}

function renderResume() {
  if (!currentData || !currentData.resume_pedagogique) return '<div style="color:var(--text3);padding:1rem">' + T('wip_resume') + '</div>';
  const r = currentData.resume_pedagogique;
  return `
    <div class="resume-grid">
      <div class="resume-card">
        <div class="resume-card-title">${T('label_motscles')}</div>
        <div class="tag-list">${(r.mots_cles_a_retenir||[]).map(m=>`<span class="tag gold" style="font-family:'Amiri',serif;font-size:16px">${m}</span>`).join('')}</div>
      </div>
      <div class="resume-card">
        <div class="resume-card-title">${T('label_racines_retenir')}</div>
        <div class="tag-list">${(r.racines_a_retenir||[]).map(r=>`<span class="tag gold">${r}</span>`).join('')}</div>
      </div>
      <div class="declic-box">
        💡 <strong>${T('label_declic')}</strong> ${r.declic_frequence || ''}
      </div>
    </div>`;
}

function selectMot(i) {
  const v = currentData.versets[currentIdx];
  const m = v.mots[i];
  // Toggle
  if (selectedMot === i) {
    selectedMot = null;
    document.querySelectorAll('.mot-card').forEach(c => c.classList.remove('active'));
    document.getElementById('mot-detail').classList.remove('active');
    document.getElementById('mot-detail').innerHTML = '';
    return;
  }
  selectedMot = i;
  document.querySelectorAll('.mot-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`mot-${i}`).classList.add('active');

  const detail = document.getElementById('mot-detail');
  detail.classList.add('active');
  detail.innerHTML = `
    <div class="mot-detail-header">
      <div class="mot-detail-ar">${m.ar}</div>
      <div class="mot-detail-info">
        <div class="mot-detail-fr">${m.fr}</div>
        <div class="mot-detail-translit">${m.translit}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <span class="racine-badge">${m.racine}</span>
        <span class="freq-badge">× ${m.frequence_coran} dans le Coran</span>
      </div>
    </div>
    ${(m.famille && m.famille.length) ? `<div class="famille-list">
      <div class="famille-list-title">Famille de mots (même racine)</div>
      <ul>${m.famille.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>` : ''}
    ${m.profondeur ? `<div class="profondeur-box">${m.profondeur}</div>` : ''}
  `;
}

function setTab(tab) {
  currentTab = tab;
  selectedMot = null;
  renderVerset();
}

let ProgressMod = null;
import('./data/progress.js').then(m => {
  ProgressMod = m;
  updateReadBtn();
  updateHideReadBtn();
  filterSourates();                                  // affiche les coches dès le chargement
  m.subscribe(() => { updateReadBtn(); filterSourates(); });  // et après synchro cloud
}).catch(()=>{});

function updateReadBtn() {
  let btn = document.getElementById('mark-read-btn');
  if (!btn) {
    const host = document.getElementById('v-theme');
    if (!host || !host.parentNode) return;
    btn = document.createElement('button');
    btn.id = 'mark-read-btn';
    btn.style.cssText = 'margin-top:8px;padding:6px 14px;border-radius:20px;border:1px solid var(--gold,#c9a227);background:transparent;color:var(--gold,#c9a227);cursor:pointer;font-size:13px;';
    btn.onclick = toggleReadSurah;
    host.parentNode.insertBefore(btn, host.nextSibling);
  }
  if (!ProgressMod || !currentS) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  const read = ProgressMod.isSurahRead(currentS[0]);
  btn.textContent = read ? '✓ Sourate lue' : 'Marquer comme lue';
  btn.style.background = read ? 'var(--gold,#c9a227)' : 'transparent';
  btn.style.color = read ? '#1a1a1a' : 'var(--gold,#c9a227)';
}

function toggleReadSurah() {
  if (!ProgressMod || !currentS) return;
  ProgressMod.toggleSurah(currentS[0]);
  updateReadBtn();
  filterSourates();   // met à jour la coche dans la liste
}

function prevV() { if (currentIdx > 0) { currentIdx--; selectedMot = null; renderVerset(); } }
function nextV() { if (currentIdx < currentS[4]-1) { currentIdx++; selectedMot = null; renderVerset(); } }

function renderNoData() {
  document.getElementById('verset-body').innerHTML = `
    <div class="no-data-box">
      <div class="big">📖</div>
      <p>${T('nodata_title')}<br>
      ${T('nodata_avail')}</p>
    </div>`;
}

function showList() {
  document.getElementById('viewer-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('stats-bar').style.display = 'flex';
  filterSourates();
}

// Thème
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? '' : 'light');
  localStorage.setItem('theme', current === 'light' ? '' : 'light');
}
const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

// Init
updateLangBtns();
document.documentElement.setAttribute('lang', currentLang());
renderGrid(SOURATES_META);

// Préchargement des sourates disponibles (badges ✓ et stats)
const DISPONIBLES = Array.from({length: 114}, (_, k) => 1 + k);
Promise.all(DISPONIBLES.map(n => loadSourateData(n))).then(() => {
  renderGrid(SOURATES_META);
  updateStats();
});
</script>
</body>
</html>
